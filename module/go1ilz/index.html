<script>
// Sayaç değerlerini saklamak için global obje (ürün ID'sine göre)
const productCounters = {};
// Ürün verilerini saklamak için global obje (hacim hesabı için)
const productData = {};
// Tüm ürünleri saklamak için global array (arama için)
let allProducts = [];
// Aktif kategoriyi sakla
let currentCategory = null;

// Toplam sayacı güncelle
function updateTotalCounter() {
    let totalAdet = 0;
    let totalHacim = 0;
    
    // Tüm ürünleri döngüyle kontrol et
    Object.keys(productCounters).forEach(productId => {
        const count = productCounters[productId];
        if (count > 0) {
            totalAdet += count;
            const product = productData[productId];
            if (product && product.Volume) {
                totalHacim += count * product.Volume;
            }
        }
    });
    
    // Adet göster
    const totalAdetElement = document.getElementById('total-adet');
    if (totalAdetElement) {
        totalAdetElement.textContent = totalAdet;
    }
    
    // Hacim göster (2 ondalık basamak)
    const totalHacimElement = document.getElementById('total-hacim');
    if (totalHacimElement) {
        totalHacimElement.textContent = totalHacim.toFixed(2) + ' m³';
    }
    
    // Kategori badge'lerini güncelle
    updateCategoryBadges();
}

// Dil kontrolü (URL'den)
function getCurrentLang() {
    const path = window.location.pathname;
    if (path.includes('/tr/')) return 'tr';
    if (path.includes('/en/')) return 'en';
    return 'tr'; // Varsayılan Türkçe
}

// Metni dile göre ayır
function getTextByLang(text) {
    if (!text || !text.includes('/')) return text;
    const parts = text.split('/').map(p => p.trim());
    const lang = getCurrentLang();
    return lang === 'tr' ? parts[0] : parts[1] || parts[0];
}

// Arama kutusunu temizle
function clearSearch() {
    const searchInput = document.getElementById('search-input');
    const searchClear = document.getElementById('search-clear');
    const suggestionsContainer = document.getElementById('search-suggestions');
    
    if (searchInput) {
        searchInput.value = '';
        performSearch('');
    }
    
    if (searchClear) {
        searchClear.style.display = 'none';
    }
    
    if (suggestionsContainer) {
        suggestionsContainer.style.display = 'none';
    }
    
    // Normal kategori görünümüne dön
    if (currentCategory) {
        renderProducts(currentCategory, null);
    }
}

// Kategori badge'lerini güncelle (sepete eklenen ürün sayısı)
function updateCategoryBadges() {
    const categoryTabs = document.querySelectorAll('.category-tab');
    
    categoryTabs.forEach(tab => {
        const category = tab.dataset.category;
        const badge = tab.querySelector('.category-badge');
        
        if (!badge) return;
        
        // Bu kategoride sepete eklenen toplam ürün sayısını hesapla
        let categoryAddedCount = 0;
        
        Object.keys(productCounters).forEach(productId => {
            const count = productCounters[productId];
            if (count > 0) {
                const product = productData[productId];
                if (product && product.ProductGroup === category) {
                    categoryAddedCount += count;
                }
            }
        });
        
        // Badge'i güncelle
        badge.textContent = categoryAddedCount;
        
        // Eğer sepete eklenen ürün yoksa badge'i gizle
        if (categoryAddedCount === 0) {
            badge.style.display = 'none';
        } else {
            badge.style.display = 'block';
        }
    });
}

// Öneri listesini göster (tüm ürünlerde)
function showSuggestions(searchTerm) {
    const suggestionsContainer = document.getElementById('search-suggestions');
    if (!suggestionsContainer) return;
    
    const searchLower = searchTerm.toLowerCase().trim();
    
    if (searchLower === '') {
        suggestionsContainer.style.display = 'none';
        return;
    }
    
    // Tüm aktif ürünlerde arama yap
    let filteredProducts = allProducts.filter(product => {
        if (!product.IsActive) return false;
        const name = getTextByLang(product.Name || '').toLowerCase();
        const code = (product.Code || '').toLowerCase();
        return name.includes(searchLower) || code.includes(searchLower);
    });
    
    // Maksimum 10 öneri göster
    filteredProducts = filteredProducts.slice(0, 10);
    
    if (filteredProducts.length === 0) {
        suggestionsContainer.innerHTML = '<div class="suggestion-empty">Sonuç bulunamadı</div>';
        suggestionsContainer.style.display = 'block';
        return;
    }
    
    // Öneri listesini oluştur
    suggestionsContainer.innerHTML = '';
    filteredProducts.forEach(product => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';
        item.innerHTML = `
            <div class="suggestion-code">${product.Code || '-'}</div>
            <div class="suggestion-name">${getTextByLang(product.Name) || '-'}</div>
            <div class="suggestion-category">${getTextByLang(product.ProductGroup) || '-'}</div>
        `;
        item.onclick = () => {
            // Öneriye tıklandığında arama kutusunu doldur ve arama yap
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.value = getTextByLang(product.Name) || product.Code || '';
                performSearch(searchInput.value);
                suggestionsContainer.style.display = 'none';
            }
        };
        suggestionsContainer.appendChild(item);
    });
    
    suggestionsContainer.style.display = 'block';
}

// Arama yap (tüm ürünlerde)
function performSearch(searchTerm) {
    const searchLower = searchTerm.toLowerCase().trim();
    const searchClear = document.getElementById('search-clear');
    const categoriesContent = document.getElementById('categories-content');
    
    // Clear butonunu göster/gizle
    if (searchClear) {
        searchClear.style.display = searchLower ? 'block' : 'none';
    }
    
    // Öneri listesini gizle
    const suggestionsContainer = document.getElementById('search-suggestions');
    if (suggestionsContainer) {
        suggestionsContainer.style.display = 'none';
    }
    
    if (searchLower === '') {
        // Arama boşsa normal kategori gösterimi
        if (currentCategory) {
            renderProducts(currentCategory, null);
        }
    } else {
        // Tüm ürünlerde arama yap
        let filteredProducts = allProducts.filter(product => {
            if (!product.IsActive) return false;
            const name = getTextByLang(product.Name || '').toLowerCase();
            const code = (product.Code || '').toLowerCase();
            return name.includes(searchLower) || code.includes(searchLower);
        });
        
        // Arama sonuçlarını göster
        renderSearchResults(filteredProducts);
    }
}

// Arama sonuçlarını render et
function renderSearchResults(products) {
    const categoriesContent = document.getElementById('categories-content');
    if (!categoriesContent) return;
    
    if (products.length === 0) {
        categoriesContent.innerHTML = '<div class="no-products">Arama sonucu bulunamadı</div>';
        return;
    }
    
    const grid = document.createElement('div');
    grid.className = 'products-grid';
    
    products.forEach(product => {
        const productId = product.ID;
        
        const card = document.createElement('div');
        card.className = 'product-card';
        
        // İsim (dile göre)
        const name = document.createElement('div');
        name.className = 'product-name';
        name.textContent = getTextByLang(product.Name) || '-';
        
        // Kategori bilgisi
        const categoryInfo = document.createElement('div');
        categoryInfo.className = 'product-category';
        categoryInfo.textContent = getTextByLang(product.ProductGroup) || '-';
        categoryInfo.style.fontSize = '12px';
        categoryInfo.style.color = '#009a96';
        categoryInfo.style.marginTop = '4px';
        
        // Detaylar
        const details = document.createElement('div');
        details.className = 'product-details';
        
        // Hacim bilgisi
        if (product.Volume) {
            const volumeItem = document.createElement('div');
            volumeItem.className = 'product-detail-item';
            volumeItem.innerHTML = `
                <span class="product-detail-label">Hacim:</span>
                <span class="product-detail-value">${product.Volume} m³</span>
            `;
            details.appendChild(volumeItem);
        }
        
        // Ağırlık bilgisi
        if (product.Weight) {
            const weightItem = document.createElement('div');
            weightItem.className = 'product-detail-item';
            weightItem.innerHTML = `
                <span class="product-detail-label">Ağırlık:</span>
                <span class="product-detail-value">${product.Weight} kg</span>
            `;
            details.appendChild(weightItem);
        }
        
        // Sayaç (Counter)
        const counter = document.createElement('div');
        counter.className = 'product-counter';
        
        // Kaydedilmiş değeri kontrol et
        let count = productCounters[productId] || 0;
        
        const decreaseBtn = document.createElement('button');
        decreaseBtn.className = 'counter-btn';
        decreaseBtn.innerHTML = '−';
        decreaseBtn.disabled = count === 0;
        
        const countValue = document.createElement('span');
        countValue.className = 'counter-value';
        countValue.textContent = count;
        
        const increaseBtn = document.createElement('button');
        increaseBtn.className = 'counter-btn';
        increaseBtn.innerHTML = '+';
        
        // Artır butonu
        increaseBtn.onclick = () => {
            count++;
            productCounters[productId] = count;
            countValue.textContent = count;
            decreaseBtn.disabled = false;
            updateTotalCounter();
        };
        
        // Azalt butonu
        decreaseBtn.onclick = () => {
            if (count > 0) {
                count--;
                productCounters[productId] = count;
                countValue.textContent = count;
                if (count === 0) {
                    decreaseBtn.disabled = true;
                }
                updateTotalCounter();
            }
        };
        
        counter.appendChild(decreaseBtn);
        counter.appendChild(countValue);
        counter.appendChild(increaseBtn);
        
        card.appendChild(name);
        card.appendChild(categoryInfo);
        card.appendChild(details);
        card.appendChild(counter);
        grid.appendChild(card);
    });
    
    categoriesContent.innerHTML = '';
    categoriesContent.appendChild(grid);
}

// Ürün verilerini yükle
fetch('https://api.hanbroscargo.workers.dev/groups')
    .then(response => response.json())
    .then(products => {
        // Tüm ürünleri sakla
        allProducts = products;
        
        // Tüm ürünleri productData'ya kaydet (hacim hesabı için)
        products.forEach(product => {
            productData[product.ID] = product;
        });
        
        // Benzersiz kategorileri çıkar
        const categories = [...new Set(products.map(p => p.ProductGroup))].filter(c => c);
        
        // Kategori tablarını oluştur
        const categoriesList = document.getElementById('categories-list');
        const categoriesContent = document.getElementById('categories-content');
        
        if (!categoriesList || !categoriesContent) return;
        
        // İlk kategoriyi aktif yap
        let activeCategory = categories[0];
        
        // Kategori tablarını render et
        categories.forEach((category, index) => {
            const tab = document.createElement('div');
            tab.className = 'category-tab' + (index === 0 ? ' active' : '');
            tab.dataset.category = category; // Orijinal kategoriyi sakla
            
            // Kategori adı
            const categoryName = document.createElement('span');
            categoryName.textContent = getTextByLang(category);
            
            // Badge (sepete eklenen ürün sayısı - başlangıçta 0, gizli)
            const badge = document.createElement('span');
            badge.className = 'category-badge';
            badge.textContent = '0';
            badge.style.display = 'none';
            
            tab.appendChild(categoryName);
            tab.appendChild(badge);
            
            tab.onclick = () => {
                // Tüm tabları pasif yap
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                // Bu tabı aktif yap
                tab.classList.add('active');
                // Arama input'unu temizle
                const searchInput = document.getElementById('search-input');
                if (searchInput) {
                    searchInput.value = '';
                }
                // İçeriği güncelle (orijinal kategoriyi kullan)
                renderProducts(tab.dataset.category);
            };
            categoriesList.appendChild(tab);
        });
        
        // Arama input'una event listener ekle
        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const value = e.target.value;
                showSuggestions(value);
                performSearch(value);
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const suggestionsContainer = document.getElementById('search-suggestions');
                    if (suggestionsContainer) {
                        suggestionsContainer.style.display = 'none';
                    }
                }
            });
            
            // Dışarı tıklandığında öneri listesini gizle
            document.addEventListener('click', (e) => {
                const searchWrapper = document.querySelector('.search-wrapper');
                const suggestionsContainer = document.getElementById('search-suggestions');
                if (searchWrapper && suggestionsContainer && !searchWrapper.contains(e.target)) {
                    suggestionsContainer.style.display = 'none';
                }
            });
        }
        
        // Ürünleri render et
        function renderProducts(category, searchTerm = null) {
            // Aktif kategoriyi güncelle
            currentCategory = category;
            
            let filteredProducts = allProducts.filter(p => p.ProductGroup === category && p.IsActive === true);
            
            // Arama terimi varsa filtrele
            if (searchTerm) {
                filteredProducts = filteredProducts.filter(product => {
                    const name = getTextByLang(product.Name || '').toLowerCase();
                    const code = (product.Code || '').toLowerCase();
                    return name.includes(searchTerm) || code.includes(searchTerm);
                });
            }
            
            if (filteredProducts.length === 0) {
                categoriesContent.innerHTML = '<div class="no-products">Bu kategoride aktif ürün bulunmuyor</div>';
                return;
            }
            
            const grid = document.createElement('div');
            grid.className = 'products-grid';
            
            filteredProducts.forEach(product => {
                const productId = product.ID;
                
                const card = document.createElement('div');
                card.className = 'product-card';
                
                // İsim (dile göre)
                const name = document.createElement('div');
                name.className = 'product-name';
                name.textContent = getTextByLang(product.Name) || '-';
                
                // Kategori bilgisi
                const categoryInfo = document.createElement('div');
                categoryInfo.className = 'product-category';
                categoryInfo.textContent = getTextByLang(product.ProductGroup) || '-';
                categoryInfo.style.fontSize = '12px';
                categoryInfo.style.color = '#009a96';
                categoryInfo.style.marginTop = '4px';
                
                // Detaylar
                const details = document.createElement('div');
                details.className = 'product-details';
                
                // Hacim bilgisi
                if (product.Volume) {
                    const volumeItem = document.createElement('div');
                    volumeItem.className = 'product-detail-item';
                    volumeItem.innerHTML = `
                        <span class="product-detail-label">Hacim:</span>
                        <span class="product-detail-value">${product.Volume} m³</span>
                    `;
                    details.appendChild(volumeItem);
                }
                
                // Ağırlık bilgisi
                if (product.Weight) {
                    const weightItem = document.createElement('div');
                    weightItem.className = 'product-detail-item';
                    weightItem.innerHTML = `
                        <span class="product-detail-label">Ağırlık:</span>
                        <span class="product-detail-value">${product.Weight} kg</span>
                    `;
                    details.appendChild(weightItem);
                }
                
                // Sayaç (Counter)
                const counter = document.createElement('div');
                counter.className = 'product-counter';
                
                // Kaydedilmiş değeri kontrol et
                let count = productCounters[productId] || 0;
                
                const decreaseBtn = document.createElement('button');
                decreaseBtn.className = 'counter-btn';
                decreaseBtn.innerHTML = '−';
                decreaseBtn.disabled = count === 0;
                
                const countValue = document.createElement('span');
                countValue.className = 'counter-value';
                countValue.textContent = count;
                
                const increaseBtn = document.createElement('button');
                increaseBtn.className = 'counter-btn';
                increaseBtn.innerHTML = '+';
                
                // Artır butonu
                increaseBtn.onclick = () => {
                    count++;
                    productCounters[productId] = count; // Değeri sakla
                    countValue.textContent = count;
                    decreaseBtn.disabled = false;
                    updateTotalCounter(); // Toplamı güncelle
                };
                
                // Azalt butonu
                decreaseBtn.onclick = () => {
                    if (count > 0) {
                        count--;
                        productCounters[productId] = count; // Değeri sakla
                        countValue.textContent = count;
                        if (count === 0) {
                            decreaseBtn.disabled = true;
                        }
                        updateTotalCounter(); // Toplamı güncelle
                    }
                };
                
                counter.appendChild(decreaseBtn);
                counter.appendChild(countValue);
                counter.appendChild(increaseBtn);
                
                card.appendChild(name);
                card.appendChild(categoryInfo);
                card.appendChild(details);
                card.appendChild(counter);
                grid.appendChild(card);
            });
            
            categoriesContent.innerHTML = '';
            categoriesContent.appendChild(grid);
        }
        
        // İlk kategoriyi göster
        renderProducts(activeCategory);
        
        // İlk yüklemede badge'leri güncelle
        updateCategoryBadges();
        
        // İlk yüklemede toplamı güncelle
        updateTotalCounter();
    })
    .catch(error => {
        console.error('Ürünler yüklenemedi:', error);
        document.getElementById('categories-content').innerHTML = 
            '<div class="no-products">Veriler yüklenirken bir hata oluştu</div>';
    });
</script>
