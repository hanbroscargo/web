<main class="modulex-wrapper" role="main" aria-label="@product-categories@">
    <div class="modulex-container">
        <nav class="modulex-categories-list" id="categories-list" role="tablist" aria-label="@product-categories-label@"></nav>
        <section class="search-section" aria-label="@product-search-label@">
            <div class="search-wrapper">
                <div class="search-container" id="search-container">
                    <label for="search-input" class="sr-only">@product-search-label@</label>
                    <span class="material-symbols-outlined search-icon-inner" aria-hidden="true">search</span>
                    <input type="text" id="search-input" name="search" class="search-input" placeholder="@product-search@" aria-label="@product-search-label@" autocomplete="off" />
                    <button type="button" class="material-symbols-outlined search-clear" id="search-clear" style="display: none;"
                        onclick="clearSearch()" aria-label="@clear-search@">close</button>
                </div>
                <div class="search-suggestions" id="search-suggestions" style="display: none;" role="listbox" aria-label="@search-suggestions@"></div>
            </div>
        </section>
        <section class="modulex-categories-content" id="categories-content" aria-label="@product-list-label@"></section>
    </div>
    <aside class="modulex-total" id="total-counter" role="complementary" aria-label="@cart-summary@">
        <div class="total-header">
            <div class="total-icon-wrapper">
                <span class="material-symbols-outlined total-icon">shopping_cart</span>
            </div>
        </div>
        <div class="total-body">
            <div class="total-item">
                <div class="total-item-icon">
                    <span class="material-symbols-outlined">inventory_2</span>
                </div>
                <div class="total-item-content">
                    <div class="total-label">@total-quantity@</div>
                    <div class="total-value" id="total-adet">0</div>
                </div>
            </div>
            <div class="total-item">
                <div class="total-item-icon">
                    <span class="material-symbols-outlined">straighten</span>
                </div>
                <div class="total-item-content">
                    <div class="total-label">@total-volume@</div>
                    <div class="total-value" id="total-hacim">0 m³</div>
                </div>
            </div>
            <div class="total-item">
                <div class="total-item-icon">
                    <span class="material-symbols-outlined">scale</span>
                </div>
                <div class="total-item-content">
                    <div class="total-label">@total-weight@</div>
                    <div class="total-value" id="total-agirlik">0 kg</div>
                </div>
            </div>
        </div>
        <footer class="total-footer">
            <button type="button" class="pdf-download-btn" onclick="downloadPDF()" id="pdf-download-btn" disabled aria-label="@download-pdf-label@">
                <span class="material-symbols-outlined" aria-hidden="true">picture_as_pdf</span>
                <span>@pdf-download@</span>
            </button>
            <div class="total-summary">
                <span class="material-symbols-outlined">check_circle</span>
                <span>@ready@</span>
            </div>
            <div class="total-warning">
                @volume-warning@
            </div>
        </div>
    </div>
</div>

<!-- Hacim Düzenleme Popup -->
<div class="volume-edit-popup" id="volume-edit-popup" style="display: none;">
    <div class="popup-overlay" onclick="closeVolumeEditPopup()"></div>
    <div class="popup-content">
        <div class="popup-header">
            <h3>@edit-dimensions-weight@</h3>
            <button class="popup-close" onclick="closeVolumeEditPopup()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="popup-body">
            <div class="popup-product-info">
                <div class="popup-product-name" id="popup-product-name"></div>
                <div class="popup-product-code" id="popup-product-code"></div>
            </div>

            <div class="popup-section">
                <h4 class="popup-section-title">@estimated-dimensions@</h4>
                <div class="popup-dimensions-grid">
                    <div class="popup-form-group">
                        <label for="popup-width-input">@width-cm@</label>
                        <input type="number" id="popup-width-input" step="0.1" min="0" class="popup-input"
                            placeholder="00" inputmode="decimal" />
                    </div>
                    <div class="popup-form-group">
                        <label for="popup-depth-input">@depth-cm@</label>
                        <input type="number" id="popup-depth-input" step="0.1" min="0" class="popup-input"
                            placeholder="00" inputmode="decimal" />
                    </div>
                    <div class="popup-form-group">
                        <label for="popup-height-input">@height-cm@</label>
                        <input type="number" id="popup-height-input" step="0.1" min="0" class="popup-input"
                            placeholder="00" inputmode="decimal" />
                    </div>
                </div>
            </div>

            <div class="popup-section">
                <h4 class="popup-section-title">@estimated-weight@</h4>
                <div class="popup-form-group">
                    <label for="popup-weight-input">@weight-kg@</label>
                    <input type="number" id="popup-weight-input" step="0.1" min="0" class="popup-input"
                        placeholder="00" inputmode="decimal" />
                    <div class="popup-hint">@weight-hint@
                    </div>
                </div>
            </div>

            <div class="popup-calculated-info">
                <div class="popup-calculated-item">
                    <span class="popup-calculated-label">@calculated-volume@</span>
                    <span class="popup-calculated-value" id="popup-calculated-volume">0.00 m³</span>
                </div>
                <div class="popup-calculated-item">
                    <span class="popup-calculated-label">@original-volume@</span>
                    <span class="popup-calculated-value" id="popup-original-volume">0.00 m³</span>
                </div>
            </div>

            <div class="popup-actions">
                <button class="popup-btn popup-btn-cancel" onclick="closeVolumeEditPopup()">
                    @menu-close@
                </button>
                <button class="popup-btn popup-btn-save" onclick="saveVolumeEdit()">@save@</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
    // Sayaç değerlerini saklamak için global obje (ürün ID'sine göre)
    const productCounters = {};
    // Ürün verilerini saklamak için global obje (hacim hesabı için)
    const productData = {};
    // Düzenlenen hacim değerlerini saklamak için global obje (ürün ID'sine göre)
    const editedVolumes = {};
    // Düzenlenen boyut ve ağırlık değerlerini saklamak için global obje (ürün ID'sine göre)
    const editedDimensions = {}; // {productId: {width, depth, height, weight}}
    // Tüm ürünleri saklamak için global array (arama için)
    let allProducts = [];
    // Aktif kategoriyi sakla
    let currentCategory = null;
    // Popup'ta düzenlenen ürün ID'si
    let editingProductId = null;

    // Toplam sayacı güncelle
    function updateTotalCounter() {
        let totalAdet = 0;
        let totalHacim = 0;
        let totalAgirlik = 0;

        // Tüm ürünleri döngüyle kontrol et
        Object.keys(productCounters).forEach(productId => {
            const count = productCounters[productId];
            if (count > 0) {
                totalAdet += count;
                const product = productData[productId];
                // Düzenlenen hacim varsa onu kullan, yoksa orijinal hacmi kullan
                const volume = editedVolumes[productId] !== undefined ? editedVolumes[productId] : (product && product.Volume ? product.Volume : 0);
                if (volume > 0) {
                    totalHacim += count * volume;
                }
                // Düzenlenen ağırlık varsa onu kullan, yoksa orijinal ağırlığı kullan
                const edited = editedDimensions[productId];
                const weight = edited?.weight || (product && product.Weight ? parseFloat(product.Weight) : 0);
                if (weight > 0) {
                    totalAgirlik += count * weight;
                }
            }
        });

        // Adet göster
        const totalAdetElement = document.getElementById('total-adet');
        if (totalAdetElement) {
            totalAdetElement.textContent = totalAdet;
        }

    // Hacim göster (2 ondalık basamak)
    const totalHacimElement = document.getElementById('total-hacim');
    if (totalHacimElement) {
        totalHacimElement.textContent = totalHacim.toFixed(2) + ' m³';
    }

        // Ağırlık göster (2 ondalık basamak)
        const totalAgirlikElement = document.getElementById('total-agirlik');
        if (totalAgirlikElement) {
            totalAgirlikElement.textContent = totalAgirlik.toFixed(2) + ' kg';
        }

        // Kategori badge'lerini güncelle
        updateCategoryBadges();

        // PDF butonunun durumunu güncelle
        const pdfBtn = document.getElementById('pdf-download-btn');
        if (pdfBtn) {
            pdfBtn.disabled = totalAdet === 0;
        }
    }

    // PDF indirme fonksiyonu
    async function downloadPDF() {
        // jsPDF kütüphanesinin yüklü olup olmadığını kontrol et
        if (typeof window.jspdf === 'undefined') {
            alert(getTranslation('pdf-loading'));
            return;
        }

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({
            orientation: 'portrait',
            unit: 'mm',
            format: 'a4'
        });
        
        // Helvetica fontunu kullan (Arial'e benzer ve Türkçe karakterleri destekler)
        doc.setFont('helvetica');

        // Logo ekle
        let logoBase64 = null;
        let logoHeight = 0; // Logo yüksekliği + boşluk (logo varsa 20mm, yoksa 0)
        let logoImgHeight = 15; // Logo resminin yüksekliği
        try {
            const logoPath = '/data/proje/hanbroscargo/web/img/logo.png';
            const logoResponse = await fetch(logoPath);
            if (logoResponse.ok) {
                const logoBlob = await logoResponse.blob();
                logoBase64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(logoBlob);
                });
                
                // Logo boyutlarını hesapla (maksimum genişlik 50mm, yükseklik orantılı)
                const logoWidth = 50;
                logoImgHeight = 15; // Logo resminin yüksekliği
                logoHeight = 20; // Logo + boşluk
                doc.addImage(logoBase64, 'PNG', 10, 10, logoWidth, logoImgHeight);
            }
        } catch (error) {
            console.warn('Logo yüklenemedi:', error);
            // Logo yüklenemezse devam et
        }

        // Sepete eklenen ürünleri topla
        const addedProducts = [];
        Object.keys(productCounters).forEach(productId => {
            const count = productCounters[productId];
            if (count > 0) {
                const product = productData[productId];
                if (product) {
                    const edited = editedDimensions[productId];
                    const volume = editedVolumes[productId] !== undefined ? editedVolumes[productId] : (product.Volume || 0);
                    const weight = edited?.weight || (product.Weight ? parseFloat(product.Weight) : 0);
                    
                    addedProducts.push({
                        name: getTextByLang(product.Name) || '-',
                        code: product.Code || '-',
                        category: getTextByLang(product.ProductGroup) || '-',
                        count: count,
                        volume: volume,
                        weight: weight,
                        totalVolume: count * volume,
                        totalWeight: count * weight
                    });
                }
            }
        });

        // Eğer sepette ürün yoksa uyarı ver
        if (addedProducts.length === 0) {
            alert(getTranslation('empty-cart'));
            return;
        }

        // Toplam değerleri hesapla
        let totalAdet = 0;
        let totalHacim = 0;
        let totalAgirlik = 0;
        addedProducts.forEach(p => {
            totalAdet += p.count;
            totalHacim += p.totalVolume;
            totalAgirlik += p.totalWeight;
        });
        
        // PDF başlığı
        var lang = getCurrentLang();
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(18);
        doc.setTextColor(0, 154, 150);
        doc.text(getTranslation('product-list'), 105, logoHeight + 10, { align: 'center' });

        // Tarih
        const now = new Date();
        const locale = lang === 'en' ? 'en-US' : 'tr-TR';
        const dateStr = now.toLocaleDateString(locale, { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text(`${getTranslation('date')} ${dateStr}`, 105, logoHeight + 18, { align: 'center' });

        // Tablo başlıkları
        let yPos = logoHeight + 30;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(0, 0, 0);
        
        doc.text('#', 12, yPos);
        // Çevirileri kullan
        doc.text(getTranslation('product-name'), 20, yPos);
        doc.text(getTranslation('category'), 85, yPos);
        doc.text(getTranslation('quantity'), 130, yPos);
        doc.text(getTranslation('volume'), 150, yPos);
        doc.text(getTranslation('weight'), 170, yPos);

        // Çizgi
        yPos += 5;
        doc.setLineWidth(0.5);
        doc.setDrawColor(0, 154, 150);
        doc.line(10, yPos, 200, yPos);

        // Ürün listesi
        yPos += 8;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        
        addedProducts.forEach((product, index) => {
            // Sayfa sonu kontrolü
            if (yPos > 270) {
                doc.addPage();
                
                // Yeni sayfada logo ekle
                if (logoBase64) {
                    const logoWidth = 50;
                    doc.addImage(logoBase64, 'PNG', 10, 10, logoWidth, logoImgHeight);
                }
                
                yPos = logoHeight + 30;
                
                // Yeni sayfada başlıkları tekrar yaz
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.text('#', 12, yPos);
                // Çevirileri kullan
                doc.text(getTranslation('product-name'), 20, yPos);
                doc.text(getTranslation('category'), 85, yPos);
                doc.text(getTranslation('quantity'), 130, yPos);
                doc.text(getTranslation('volume'), 150, yPos);
                doc.text(getTranslation('weight'), 170, yPos);
                yPos += 5;
                doc.line(10, yPos, 200, yPos);
                yPos += 8;
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8);
            }

            doc.text((index + 1).toString(), 12, yPos);
            
            // Ürün adı (uzunsa kısalt) - Türkçe karakter desteği
            const name = product.name.length > 40 ? product.name.substring(0, 37) + '...' : product.name;
            // jsPDF Unicode karakterleri destekler, direkt kullan
            doc.text(name, 20, yPos, { maxWidth: 60 });
            
            // Kategori (uzunsa kısalt) - Türkçe karakter desteği
            const category = product.category.length > 20 ? product.category.substring(0, 17) + '...' : product.category;
            doc.text(category, 85, yPos);
            
            doc.text(product.count.toString(), 130, yPos);
            doc.text(product.totalVolume > 0 ? product.totalVolume.toFixed(2) : '-', 150, yPos);
            
            // Ağırlık - Türkçe karakter desteği (ağırlık değeri sayı olduğu için sorun olmaz)
            const weightText = product.totalWeight > 0 ? product.totalWeight.toFixed(2) : '-';
            doc.text(weightText, 170, yPos);
            
            yPos += 7;
        });

        // Toplam satırı
        yPos += 5;
        doc.setLineWidth(0.3);
        doc.setDrawColor(200, 200, 200);
        doc.line(10, yPos, 200, yPos);
        
        yPos += 8;
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(0, 154, 150);
        doc.text(getTranslation('total'), 20, yPos);
        doc.text(totalAdet.toString(), 130, yPos);
        doc.text(totalHacim > 0 ? totalHacim.toFixed(2) : '-', 150, yPos);
        doc.text(totalAgirlik > 0 ? totalAgirlik.toFixed(2) : '-', 170, yPos);

        // Dosya adı oluştur
        const fileName = `urun-listesi-${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}-${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}.pdf`;

        // PDF'i indir
        doc.save(fileName);
    }

    // Dil kontrolü (URL'den)
    function getCurrentLang() {
        const path = window.location.pathname;
        if (path.includes('/tr/')) return 'tr';
        if (path.includes('/en/')) return 'en';
        return 'tr'; // Varsayılan Türkçe
    }

    // Metni dile göre ayır
    function getTextByLang(text) {
        if (!text || !text.includes('/')) return text;
        const parts = text.split('/').map(p => p.trim());
        const lang = getCurrentLang();
        return lang === 'tr' ? parts[0] : parts[1] || parts[0];
    }

    // Çeviri fonksiyonu (lang.json'dan)
    var translationsCache = null;
    function getTranslation(key) {
        var lang = getCurrentLang();
        
        // Önce global translate objesini kontrol et (webmakerrender.js tarafından sağlanır)
        if (typeof translate !== 'undefined' && translate[key] && translate[key][lang]) {
            return translate[key][lang];
        }
        
        // Cache'den kontrol et
        if (translationsCache && translationsCache[key] && translationsCache[key][lang]) {
            return translationsCache[key][lang];
        }
        
        // Fallback: key'i döndür
        return key;
    }
    
    // Lang.json'u yükle (eğer translate objesi yoksa)
    if (typeof translate === 'undefined' || Object.keys(translate).length === 0) {
        fetch('/webyapar/modul/lang.json', {
            method: 'GET',
            headers: {
                'Accept': 'application/json'
            },
            cache: 'no-cache'
        })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                return response.json();
            })
            .then(function(data) {
                translationsCache = data;
            })
            .catch(function(error) {
                console.warn('Lang.json yüklenemedi:', error);
            });
    }

    // Hacim hesapla (cm'den m³'e çevir)
    function calculateVolume(width, depth, height) {
        if (!width || !depth || !height) return 0;
        // cm'den m³'e çevir: (cm × cm × cm) / 1,000,000 = m³
        return (parseFloat(width) * parseFloat(depth) * parseFloat(height)) / 1000000;
    }

    // Hacim hesaplamasını güncelle
    function updateCalculatedVolume() {
        const widthInput = document.getElementById('popup-width-input');
        const depthInput = document.getElementById('popup-depth-input');
        const heightInput = document.getElementById('popup-height-input');
        const calculatedVolume = document.getElementById('popup-calculated-volume');

        if (!widthInput || !depthInput || !heightInput || !calculatedVolume) return;

        const width = widthInput.value;
        const depth = depthInput.value;
        const height = heightInput.value;

    const volume = calculateVolume(width, depth, height);
    calculatedVolume.textContent = volume > 0 ? `${volume.toFixed(2)} m³` : '0.00 m³';
    }

    // Popup aç
    function openVolumeEditPopup(productId) {
        const product = productData[productId];
        if (!product) return;

        editingProductId = productId;
        const popup = document.getElementById('volume-edit-popup');
        const productName = document.getElementById('popup-product-name');

        const depthInput = document.getElementById('popup-depth-input');
        const heightInput = document.getElementById('popup-height-input');
        const weightInput = document.getElementById('popup-weight-input');

        if (popup && productName && productCode && originalVolume) {
            productName.textContent = getTextByLang(product.Name) || '-';
            productCode.textContent = `${getTranslation('code')} ${product.Code || '-'}`;

        // Orijinal hacmi göster
        const originalVol = product.Volume || 0;
        originalVolume.textContent = `${parseFloat(originalVol).toFixed(2)} m³`;

            // Düzenlenen değerleri kontrol et
            const edited = editedDimensions[productId];

            if (widthInput) {
                widthInput.value = edited?.width || '';
            }
            if (depthInput) {
                depthInput.value = edited?.depth || '';
            }
            if (heightInput) {
                heightInput.value = edited?.height || '';
            }
            if (weightInput) {
                weightInput.value = edited?.weight || (product.Weight || '');
            }

            // Event listener'ları ekle (bir kez)
            if (widthInput && !widthInput.dataset.listenerAdded) {
                widthInput.addEventListener('input', updateCalculatedVolume);
                widthInput.dataset.listenerAdded = 'true';
            }
            if (depthInput && !depthInput.dataset.listenerAdded) {
                depthInput.addEventListener('input', updateCalculatedVolume);
                depthInput.dataset.listenerAdded = 'true';
            }
            if (heightInput && !heightInput.dataset.listenerAdded) {
                heightInput.addEventListener('input', updateCalculatedVolume);
                heightInput.dataset.listenerAdded = 'true';
            }

            // İlk hacim hesaplamasını yap
            updateCalculatedVolume();

            // Body scroll'unu engelle
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
            document.body.style.width = '100%';

    // Hacim düzenlemesini kaydet
    function saveVolumeEdit() {
        if (!editingProductId) return;

        const widthInput = document.getElementById('popup-width-input');
        const depthInput = document.getElementById('popup-depth-input');
        const heightInput = document.getElementById('popup-height-input');
        const weightInput = document.getElementById('popup-weight-input');

        if (!widthInput || !depthInput || !heightInput || !weightInput) return;

        const width = parseFloat(widthInput.value);
        const depth = parseFloat(depthInput.value);
        const height = parseFloat(heightInput.value);
        const weight = parseFloat(weightInput.value);

        const product = productData[editingProductId];
        if (!product) return;

        // Boyutların hepsi dolu mu kontrol et
        const hasDimensions = width > 0 && depth > 0 && height > 0;

        if (hasDimensions) {
            // Hacmi hesapla
            const calculatedVolume = calculateVolume(width, depth, height);

            // Boyut ve ağırlık bilgilerini kaydet
            editedDimensions[editingProductId] = {
                width: width,
                depth: depth,
                height: height,
                weight: weight > 0 ? weight : null
            };

            // Hacmi kaydet
            editedVolumes[editingProductId] = calculatedVolume;
        } else {
            // Eğer boyutlar eksikse, sadece ağırlık kaydedilebilir
            if (weight > 0) {
                if (!editedDimensions[editingProductId]) {
                    editedDimensions[editingProductId] = {};
                }
                editedDimensions[editingProductId].weight = weight;
            }

            // Eğer hiçbir değer yoksa, düzenlenen değerleri temizle
            if (!hasDimensions && (!weight || weight <= 0)) {
                delete editedDimensions[editingProductId];
                delete editedVolumes[editingProductId];
            }
        }

        // Eğer ürün sayacı 0 ise otomatik olarak 1 tane ekle
        const currentCount = productCounters[editingProductId] || 0;
        if (currentCount === 0) {
            productCounters[editingProductId] = 1;
            // Ürün kartlarındaki sayacı güncelle
            updateProductCounterDisplay(editingProductId, 1);
            // Card'a aktif durumu ekle
            const productCards = document.querySelectorAll('.product-card');
            productCards.forEach(card => {
                const cardProductId = card.dataset.productId;
                if (cardProductId && (cardProductId === editingProductId.toString() || parseInt(cardProductId) === editingProductId)) {
                    card.classList.add('active');
                }
            });
        }

        // Toplamları güncelle
        updateTotalCounter();

        // Ürün kartlarındaki hacim gösterimini güncelle
        updateProductVolumeDisplay(editingProductId);

        // Popup'ı kapat
        closeVolumeEditPopup();
    }

// Decrease butonunun içeriğini güncelle (1 ise çöp kutusu, 1'den fazla ise -)
function updateDecreaseButton(button, count) {
    if (!button) return;
    if (count === 1) {
        button.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">delete</span>';
        button.classList.add('delete-btn');
    } else if (count > 1) {
        button.innerHTML = '−';
        button.classList.remove('delete-btn');
    }
}

// Ürün kartındaki sayaç gösterimini güncelle
function updateProductCounterDisplay(productId, count) {
        // Tüm ürün kartlarını bul
        const productCards = document.querySelectorAll('.product-card');
        productCards.forEach(card => {
            const cardProductId = card.dataset.productId;
            // String karşılaştırması yap
            if (cardProductId && (cardProductId === productId.toString() || parseInt(cardProductId) === productId)) {
                // Sayaç gösterimini bul ve güncelle
                const countValue = card.querySelector('.counter-value');
                const counter = card.querySelector('.product-counter');

                if (counter) {
                    // Tüm butonları bul
                    const decreaseBtn = counter.querySelector('.counter-btn:first-of-type');
                    const editBtn = counter.querySelector('.edit-btn');

                    if (countValue) {
                        countValue.textContent = count;
                        countValue.style.display = count > 0 ? 'block' : 'none';
                    }

                    if (decreaseBtn) {
                        decreaseBtn.style.display = count > 0 ? 'flex' : 'none';
                        // Buton içeriğini güncelle (1 ise çöp kutusu, 1'den fazla ise -)
                        updateDecreaseButton(decreaseBtn, count);
                    }

                    if (editBtn) {
                        editBtn.style.display = count > 0 ? 'flex' : 'none';
                    }
                }
                
                // Card'a aktif durumu ekle/kaldır
                if (count > 0) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            }
        });
    }

    // Ürün kartındaki hacim gösterimini güncelle

        const product = productData[productId];
        if (!product) return;

        // Tüm ürün kartlarını bul
        const productCards = document.querySelectorAll('.product-card');
        productCards.forEach(card => {

            if (cardProductId && (cardProductId === productId.toString() || parseInt(cardProductId) === productId)) {

    // Kategori badge'lerini güncelle (sepete eklenen ürün sayısı ve metreküp)
    function updateCategoryBadges() {
        const categoryTabs = document.querySelectorAll('.category-tab');

        categoryTabs.forEach(tab => {
            const category = tab.dataset.category;
            const categoryVolume = tab.querySelector('.category-volume');
            const categoryCount = tab.querySelector('.category-count');

            if (!categoryVolume || !categoryCount) return;

            // Bu kategoride sepete eklenen toplam ürün sayısını ve metreküp hesapla
            let categoryAddedCount = 0;
            let categoryTotalVolume = 0;

            Object.keys(productCounters).forEach(productId => {
                const count = productCounters[productId];
                if (count > 0) {
                    const product = productData[productId];
                    if (product && product.ProductGroup === category) {
                        categoryAddedCount += count;
                        // Düzenlenen hacim varsa onu kullan, yoksa orijinal hacmi kullan
                        const volume = editedVolumes[productId] !== undefined ? editedVolumes[productId] : (product.Volume || 0);
                        if (volume > 0) {
                            categoryTotalVolume += count * volume;
                        }
                    }
                }
            });

            // Ürün eklenen kategorilere aktif tasarımı ekle
            if (categoryAddedCount > 0) {
                tab.classList.add('has-products');
                
                // Alt satırda metre küp ve toplam sayı
                categoryVolume.textContent = `${categoryTotalVolume.toFixed(2)} m³`;
                categoryVolume.style.display = 'inline';
                
                categoryCount.textContent = `${categoryAddedCount} ${getTranslation('piece')}`;
                categoryCount.style.display = 'inline';
            } else {
                tab.classList.remove('has-products');
                
                // Alt satırı gizle
                categoryVolume.style.display = 'none';
                categoryCount.style.display = 'none';
            }
        });
    }

    // Öneri listesini göster (tüm ürünlerde)
    function showSuggestions(searchTerm) {
        const suggestionsContainer = document.getElementById('search-suggestions');
        if (!suggestionsContainer) return;

        const searchLower = searchTerm.toLowerCase().trim();

        if (searchLower === '') {
            suggestionsContainer.style.display = 'none';
            return;
        }

        // Tüm aktif ürünlerde arama yap
        let filteredProducts = allProducts.filter(product => {
            if (!product.IsActive) return false;
            const name = getTextByLang(product.Name || '').toLowerCase();
            const code = (product.Code || '').toLowerCase();
            return name.includes(searchLower) || code.includes(searchLower);
        });

        // Maksimum 10 öneri göster
        filteredProducts = filteredProducts.slice(0, 10);

        if (filteredProducts.length === 0) {
            suggestionsContainer.innerHTML = '<div class="suggestion-empty">' + getTranslation('no-results') + '</div>';
            suggestionsContainer.style.display = 'block';
            return;
        }

        // Öneri listesini oluştur
        suggestionsContainer.innerHTML = '';
        filteredProducts.forEach(product => {
            const item = document.createElement('div');
            item.className = 'suggestion-item';
            item.innerHTML = `
            <div class="suggestion-code">${product.Code || '-'}</div>
            <div class="suggestion-name">${getTextByLang(product.Name) || '-'}</div>
            <div class="suggestion-category">${getTextByLang(product.ProductGroup) || '-'}</div>
        `;
            item.onclick = () => {
                // Öneriye tıklandığında arama kutusunu doldur ve arama yap
                const searchInput = document.getElementById('search-input');
                if (searchInput) {
                    searchInput.value = getTextByLang(product.Name) || product.Code || '';
                    performSearch(searchInput.value);
                    suggestionsContainer.style.display = 'none';
                }
            };
            suggestionsContainer.appendChild(item);
        });

        suggestionsContainer.style.display = 'block';
    }

    // Arama yap (tüm ürünlerde)
    function performSearch(searchTerm) {
        const searchLower = searchTerm.toLowerCase().trim();
        const searchClear = document.getElementById('search-clear');
        const categoriesContent = document.getElementById('categories-content');

        // Clear butonunu göster/gizle
        if (searchClear) {
            searchClear.style.display = searchLower ? 'block' : 'none';
        }

        // Öneri listesini gizle
        const suggestionsContainer = document.getElementById('search-suggestions');
        if (suggestionsContainer) {
            suggestionsContainer.style.display = 'none';
        }

        if (searchLower === '') {
            // Arama boşsa normal kategori gösterimi
            if (currentCategory) {
                renderProducts(currentCategory, null);
            } else {
                // Eğer kategori seçilmemişse, ilk kategoriyi göster
                const firstTab = document.querySelector('.category-tab');
                if (firstTab) {
                    const firstCategory = firstTab.dataset.category;
                    if (firstCategory) {
                        // İlk tabı aktif yap
                        document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                        firstTab.classList.add('active');
                        renderProducts(firstCategory, null);
                    }
                }
            }
        } else {
            // Tüm ürünlerde arama yap
            let filteredProducts = allProducts.filter(product => {
                if (!product.IsActive) return false;
                const name = getTextByLang(product.Name || '').toLowerCase();
                const code = (product.Code || '').toLowerCase();
                return name.includes(searchLower) || code.includes(searchLower);
            });

            // Arama sonuçlarını göster
            renderSearchResults(filteredProducts);
        }
    }

            infoWrapper.className = 'product-info-wrapper';

                <span class="product-detail-label">Ağırlık:</span>

            counter.className = 'product-counter';

            // Card'a aktif durumu ekle (count > 0 ise)

                card.classList.add('active');
            }

                decreaseBtn.classList.add('delete-btn');
            } else if (count > 1) {
                decreaseBtn.innerHTML = '−';
                decreaseBtn.classList.remove('delete-btn');
            }
            decreaseBtn.style.display = count > 0 ? 'flex' : 'none';

            const countValue = document.createElement('span');
            countValue.className = 'counter-value';
            countValue.textContent = count;
            countValue.style.display = count > 0 ? 'block' : 'none';

            const increaseBtn = document.createElement('button');
            increaseBtn.className = 'counter-btn';
            increaseBtn.innerHTML = '+';

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">edit</span>';
            editBtn.title = 'Hacim düzenle';
            editBtn.style.display = count > 0 ? 'flex' : 'none';
            editBtn.onclick = () => openVolumeEditPopup(productId);

            // Artır butonu
            increaseBtn.onclick = () => {
                count++;
                productCounters[productId] = count;
                countValue.textContent = count;
                // Butonları göster
                decreaseBtn.style.display = 'flex';
                countValue.style.display = 'block';
                editBtn.style.display = 'flex';
                // Buton içeriğini güncelle (1 ise çöp kutusu, 1'den fazla ise -)
                updateDecreaseButton(decreaseBtn, count);
                // Card'a aktif durumu ekle
                card.classList.add('active');
                updateTotalCounter();
            };

            // Azalt butonu
            decreaseBtn.onclick = () => {
                if (count > 0) {
                    count--;
                    productCounters[productId] = count;
                    countValue.textContent = count;
                    if (count === 0) {

                        countValue.style.display = 'none';
                        editBtn.style.display = 'none';

                }
            };

            counter.appendChild(decreaseBtn);
            counter.appendChild(countValue);
            counter.appendChild(increaseBtn);
            counter.appendChild(editBtn);

            // infoWrapper içine infoRow ekle (infoContent ve details zaten içinde)
            infoWrapper.appendChild(infoRow);

            card.appendChild(infoWrapper);
            card.appendChild(counter);
            grid.appendChild(card);
        });

        categoriesContent.innerHTML = '';
        categoriesContent.appendChild(grid);
    }

    // Ürün verilerini yükle
    function loadProducts(retryCount) {
        retryCount = retryCount || 0;
        var maxRetries = 3;
        
        // Loading göster
        var categoriesContent = document.getElementById('categories-content');
        if (categoriesContent) {
            categoriesContent.innerHTML = '<div class="no-products" style="text-align: center; padding: 40px;">' + (getTranslation('loading') || 'Yükleniyor') + '...</div>';
        }
        
        // AbortController ile timeout kontrolü (mobilde network sorunları için)
        var abortController = new AbortController();
        var timeoutId = setTimeout(function() {
            abortController.abort();
            console.error('API timeout - 20 saniye içinde yanıt alınamadı');
        }, 20000); // 20 saniye timeout (mobilde daha uzun sürebilir)
        
        fetch('https://api.hanbroscargo.workers.dev/groups', {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            mode: 'cors',
            cache: 'no-cache',
            signal: abortController.signal
        })
        .then(function(response) {
            clearTimeout(timeoutId);
            if (!response.ok) {
                throw new Error('HTTP ' + response.status + ': ' + response.statusText);
            }
            return response.json();
        })
        .then(function(products) {
            // Tüm ürünleri sakla
            allProducts = products;

            // Tüm ürünleri productData'ya kaydet (hacim hesabı için)
            products.forEach(product => {
                productData[product.ID] = product;
            });

            // Benzersiz kategorileri çıkar
            const categories = [...new Set(products.map(p => p.ProductGroup))].filter(c => c);

            // Kategori tablarını oluştur
            const categoriesList = document.getElementById('categories-list');
            const categoriesContent = document.getElementById('categories-content');

            if (!categoriesList || !categoriesContent) return;

            // İlk kategoriyi aktif yap
            let activeCategory = categories[0];

            // Kategori tablarını render et
            categories.forEach((category, index) => {
                const tab = document.createElement('div');
                tab.className = 'category-tab' + (index === 0 ? ' active' : '');
                tab.dataset.category = category; // Orijinal kategoriyi sakla

                // Üst satır (sadece kategori adı)
                const topRow = document.createElement('div');
                topRow.className = 'category-tab-row';

                // Kategori adı
                const categoryName = document.createElement('span');
                categoryName.textContent = getTextByLang(category);

                topRow.appendChild(categoryName);

                // Alt satır (metre küp + toplam sayı)
                const bottomRow = document.createElement('div');
                bottomRow.className = 'category-tab-bottom';

                // Hacim toplamı (başlangıçta gizli)
                const categoryVolume = document.createElement('span');
                categoryVolume.className = 'category-volume';
                categoryVolume.textContent = '';
                categoryVolume.style.display = 'none';
                categoryVolume.dataset.category = category;

                // Toplam sayı (alt satırda gösterilecek)
                const categoryCount = document.createElement('span');
                categoryCount.className = 'category-count';
                categoryCount.textContent = '';
                categoryCount.style.display = 'none';

                bottomRow.appendChild(categoryVolume);
                bottomRow.appendChild(categoryCount);

                tab.appendChild(topRow);
                tab.appendChild(bottomRow);

                tab.onclick = () => {
                    // Tüm tabları pasif yap
                    document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                    // Bu tabı aktif yap
                    tab.classList.add('active');
                    // Arama input'unu temizle
                    const searchInput = document.getElementById('search-input');
                    if (searchInput) {
                        searchInput.value = '';
                    }
                    // İçeriği güncelle (orijinal kategoriyi kullan)
                    renderProducts(tab.dataset.category);
                };
                categoriesList.appendChild(tab);
            });

            // Arama input'una event listener ekle
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const value = e.target.value;
                    showSuggestions(value);
                    performSearch(value);
                });

                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const suggestionsContainer = document.getElementById('search-suggestions');
                        if (suggestionsContainer) {
                            suggestionsContainer.style.display = 'none';
                        }
                    }
                });

                // Dışarı tıklandığında öneri listesini gizle
                document.addEventListener('click', (e) => {
                    const searchWrapper = document.querySelector('.search-wrapper');
                    const suggestionsContainer = document.getElementById('search-suggestions');
                    if (searchWrapper && suggestionsContainer && !searchWrapper.contains(e.target)) {
                        suggestionsContainer.style.display = 'none';
                    }
                });
            }

            // Ürünleri render et
            function renderProducts(category, searchTerm = null) {
                // Aktif kategoriyi güncelle
                currentCategory = category;

                let filteredProducts = allProducts.filter(p => p.ProductGroup === category && p.IsActive === true);

                // Arama terimi varsa filtrele
                if (searchTerm) {
                    filteredProducts = filteredProducts.filter(product => {
                        const name = getTextByLang(product.Name || '').toLowerCase();
                        const code = (product.Code || '').toLowerCase();
                        return name.includes(searchTerm) || code.includes(searchTerm);
                    });
                }

                if (filteredProducts.length === 0) {
                    categoriesContent.innerHTML = '<div class="no-products">' + getTranslation('no-products') + '</div>';
                    return;
                }

                const grid = document.createElement('div');
                grid.className = 'products-grid';

                filteredProducts.forEach(product => {
                    const productId = product.ID;

                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.dataset.productId = productId; // Ürün ID'sini sakla

                    // Bilgi wrapper'ı (isim, kategori ve detaylar)
                    const infoWrapper = document.createElement('div');
                    infoWrapper.className = 'product-info-wrapper';

                    // İçerik wrapper'ı (isim ve kategori)
                    const infoContent = document.createElement('div');
                    infoContent.className = 'product-info-content';

                    // İsim (dile göre)
                    const name = document.createElement('div');
                    name.className = 'product-name';
                    name.textContent = getTextByLang(product.Name) || '-';

                    // Kategori bilgisi
                    const categoryInfo = document.createElement('div');
                    categoryInfo.className = 'product-category';
                    const categoryText = getTextByLang(product.ProductGroup) || '-';
                    
                    // Hacim bilgisi (düzenlenen değeri kullan)
                    const volume = editedVolumes[productId] !== undefined ? editedVolumes[productId] : (product.Volume || 0);
                    if (volume > 0 || product.Volume) {
                        categoryInfo.innerHTML = `${categoryText} <span class="product-volume-inline">• ${parseFloat(volume).toFixed(2)} m³</span>`;
                    } else {
                        categoryInfo.textContent = categoryText;
                    }

                    infoContent.appendChild(name);
                    infoContent.appendChild(categoryInfo);

                    // Detaylar
                    const details = document.createElement('div');
                    details.className = 'product-details';

                    // Kategori ve detayları bir arada tutan row wrapper
                    const infoRow = document.createElement('div');
                    infoRow.className = 'product-info-row';
                    infoRow.appendChild(infoContent);
                    infoRow.appendChild(details);

                    // Ağırlık bilgisi (düzenlenen değeri kullan)
                    const edited = editedDimensions[productId];
                    const weight = edited?.weight || product.Weight;
                    if (weight) {
                        const weightItem = document.createElement('div');
                        weightItem.className = 'product-detail-item';
                        weightItem.innerHTML = `
                        <span class="product-detail-label">Ağırlık:</span>
                        <span class="product-detail-value">${weight} kg</span>
                    `;
                        details.appendChild(weightItem);
                    }

                    // Sayaç (Counter)
                    const counter = document.createElement('div');
                    counter.className = 'product-counter';

                    // Kaydedilmiş değeri kontrol et
                    let count = productCounters[productId] || 0;

                    // Card'a aktif durumu ekle (count > 0 ise)
                    if (count > 0) {
                        card.classList.add('active');
                    }

                    const decreaseBtn = document.createElement('button');
                    decreaseBtn.className = 'counter-btn';
                    // Count değerine göre buton içeriğini ayarla
                    if (count === 1) {
                        decreaseBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">delete</span>';
                        decreaseBtn.classList.add('delete-btn');
                    } else if (count > 1) {
                        decreaseBtn.innerHTML = '−';
                        decreaseBtn.classList.remove('delete-btn');
                    }
                    decreaseBtn.style.display = count > 0 ? 'flex' : 'none';

                    const countValue = document.createElement('span');
                    countValue.className = 'counter-value';
                    countValue.textContent = count;
                    countValue.style.display = count > 0 ? 'block' : 'none';

                    const increaseBtn = document.createElement('button');
                    increaseBtn.className = 'counter-btn';
                    increaseBtn.innerHTML = '+';

                    // Edit butonu
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-btn';
                    editBtn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 18px;">edit</span>';
                    editBtn.title = 'Hacim düzenle';
                    editBtn.style.display = count > 0 ? 'flex' : 'none';
                    editBtn.onclick = () => openVolumeEditPopup(productId);

                    // Artır butonu
                    increaseBtn.onclick = () => {
                        count++;
                        productCounters[productId] = count; // Değeri sakla
                        countValue.textContent = count;
                        // Butonları göster
                        decreaseBtn.style.display = 'flex';
                        countValue.style.display = 'block';
                        editBtn.style.display = 'flex';
                        // Buton içeriğini güncelle (1 ise çöp kutusu, 1'den fazla ise -)
                        updateDecreaseButton(decreaseBtn, count);
                        // Card'a aktif durumu ekle
                        card.classList.add('active');
                        updateTotalCounter(); // Toplamı güncelle
                    };

                    // Azalt butonu
                    decreaseBtn.onclick = () => {
                        if (count > 0) {
                            count--;
                            productCounters[productId] = count; // Değeri sakla
                            countValue.textContent = count;
                            if (count === 0) {
                                // Butonları gizle
                                decreaseBtn.style.display = 'none';
                                countValue.style.display = 'none';
                                editBtn.style.display = 'none';
                                // Card'dan aktif durumu kaldır
                                card.classList.remove('active');
                            } else {
                                // Buton içeriğini güncelle (1 ise çöp kutusu, 1'den fazla ise -)
                                updateDecreaseButton(decreaseBtn, count);
                            }
                            updateTotalCounter(); // Toplamı güncelle
                        }
                    };

                    counter.appendChild(decreaseBtn);
                    counter.appendChild(countValue);
                    counter.appendChild(increaseBtn);
                    counter.appendChild(editBtn);

                    // infoWrapper içine infoRow ekle (infoContent ve details zaten içinde)
                    infoWrapper.appendChild(infoRow);

                    card.appendChild(infoWrapper);
                    card.appendChild(counter);
                    grid.appendChild(card);
                });

                categoriesContent.innerHTML = '';
                categoriesContent.appendChild(grid);
            }

            // İlk kategoriyi göster
            renderProducts(activeCategory);

            // İlk yüklemede badge'leri güncelle
            updateCategoryBadges();

            // İlk yüklemede toplamı güncelle
            updateTotalCounter();
        })
        .catch(function(error) {
            clearTimeout(timeoutId);
            console.error('Ürünler yüklenemedi:', error);
            
            // Retry mekanizması (maksimum 3 deneme)
            if (retryCount < maxRetries) {
                console.log('Tekrar deneme: ' + (retryCount + 1) + '/' + maxRetries);
                setTimeout(function() {
                    loadProducts(retryCount + 1);
                }, 2000 * (retryCount + 1)); // Her denemede bekleme süresini artır
                return;
            }
            
            var categoriesContent = document.getElementById('categories-content');
            if (categoriesContent) {
                var errorMsg = getTranslation('loading-error') || 'Veriler yüklenemedi';
                var errorDetail = '';
                
                // Hata tipine göre mesaj
                if (error.name === 'AbortError' || (error.message && error.message.includes('timeout'))) {
                    errorDetail = 'Bağlantı zaman aşımına uğradı. Lütfen internet bağlantınızı kontrol edin.';
                } else if (error.message && error.message.includes('Failed to fetch')) {
                    errorDetail = 'Sunucuya bağlanılamadı. Lütfen internet bağlantınızı kontrol edin.';
                } else if (error.message && error.message.includes('CORS')) {
                    errorDetail = 'CORS hatası. Lütfen daha sonra tekrar deneyin.';
                } else {
                    errorDetail = error.message || 'Bilinmeyen bir hata oluştu.';
                }
                
                categoriesContent.innerHTML = '<div class="no-products" style="text-align: center; padding: 40px;">' +
                    '<div style="color: #dc3545; margin-bottom: 10px; font-weight: 600;">' + errorMsg + '</div>' +
                    '<div style="font-size: 12px; color: #666; margin-bottom: 15px;">' + errorDetail + '</div>' +
                    '<button onclick="loadProducts(0)" style="padding: 10px 20px; background: #009a96; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; cursor: pointer;">Tekrar Dene</button>' +
                    '</div>';
            }
        });
    }
    
    // Sayfa yüklendiğinde ürünleri yükle
    setTimeout(function() {
        loadProducts(0);
    }, 100);
</script>
