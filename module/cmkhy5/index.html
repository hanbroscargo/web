<header class="modulex" role="banner">

  <div class="modulexbody">
    <a href="/{{lang}}/" aria-label="{{web-name}} Ana Sayfa">
      <img src="/img/{{logo}}?v={{random}}" class="module-logo" alt="{{web-name}} Logo" width="300" height="auto" />
    </a>


    <div class="lang_telif">
      <nav class="modulextitlebodylang" aria-label="Dil seçimi">
        {{langhtml}}
      </nav>

      <div class="header-actions">
        <nav class="contact-buttons" aria-label="Hızlı erişim butonları">
          <a href="/{{lang}}/gonderi-takip/" class="btn-track" title="{{gonder}} - Gönderi takip sayfasına git">
            <i class="icon" aria-hidden="true">🚛</i>
            <span>{{gonder}}</span>
          </a>
          <a href="/{{lang}}/teklif-al/" class="btn-quote" title="{{teklifal}} - Teklif al sayfasına git">
            <i class="icon" aria-hidden="true">✏️</i>
            <span>{{teklifal}}</span>
          </a>
        </nav>
      </div>

    </div>
  </div>
  <nav class="modulexmenubody" role="navigation" aria-label="Ana menü">
    <div class="modulexmenu">
      <button class="mobile-menu-toggle" aria-expanded="false" aria-label="Menüyü aç/kapat"
        aria-controls="modulexmenulistbody">
        <span class="mobile-menu-toggle-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <div class="mobile-menu-overlay" id="mobile-menu-overlay" aria-hidden="true"></div>
      <div class="modulexmenulistbody" id="modulexmenulistbody">
        <button class="mobile-menu-close" type="button" aria-label="Menüyü kapat" aria-controls="modulexmenulistbody">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
        <div class="modulexmenulist">
          {{html}}
          <div class="mobile-lang-wrapper" role="navigation" aria-label="Mobil dil seçimi">{{langhtml}}</div>
        </div>
      </div>
    </div>
  </nav>
</header>

<script>
  setTimeout(function () {
    try {
      // Direkt selector kullan - daha güvenilir
      var toggle = document.querySelector(".mobile-menu-toggle");
      var menuBody = document.querySelector(".modulexmenulistbody");
      var overlay = document.querySelector(".mobile-menu-overlay");
      var closeButton = document.querySelector(".mobile-menu-close");

      if (!toggle || !menuBody) {
        return;
      }

      var mql = window.matchMedia("(max-width: 768px)");

      // Menüyü aç fonksiyonu
      function openMenu() {
        if (menuBody) {
          menuBody.classList.add("is-visible");
        }
        if (overlay) {
          overlay.classList.add("active");
          overlay.setAttribute("aria-hidden", "false");
        }
        if (toggle) {
          toggle.classList.add("is-active");
          toggle.setAttribute("aria-expanded", "true");
        }
        // Body scroll'u engelle
        document.body.style.overflow = "hidden";
      }

      // Menüyü kapat fonksiyonu
      function closeMenu() {
        if (menuBody) {
          menuBody.classList.remove("is-visible");
          menuBody.classList.remove("swiping");
          menuBody.style.transform = "";
        }
        if (overlay) {
          overlay.classList.remove("active");
          overlay.setAttribute("aria-hidden", "true");
          overlay.style.opacity = "";
        }
        if (toggle) {
          toggle.classList.remove("is-active");
          toggle.setAttribute("aria-expanded", "false");
        }
        // Body scroll'u geri getir
        document.body.style.overflow = "";
        // Focus'u menü butonuna geri ver
        if (toggle) {
          toggle.focus();
        }
      }

      // Toggle butonu
      toggle.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (menuBody.classList.contains("is-visible")) {
          closeMenu();
        } else {
          openMenu();
        }
      });

      // Kapatma butonu
      if (closeButton) {
        closeButton.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeMenu();
        });
      }

      // Overlay'e tıklanınca kapat
      if (overlay) {
        overlay.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeMenu();
        });
      }

      // Swipe-to-close özelliği (mobil uygulamalar gibi)
      var touchStartX = 0;
      var touchStartY = 0;
      var touchCurrentX = 0;
      var isSwiping = false;
      var swipeThreshold = 50; // Minimum çekme mesafesi (px)
      var menuWidth = 0;

      // Menü genişliğini al
      function getMenuWidth() {
        if (menuBody) {
          return menuBody.offsetWidth || window.innerWidth * 0.8;
        }
        return 320;
      }

      // Touch başlangıcı
      menuBody.addEventListener("touchstart", function (e) {
        if (!menuBody.classList.contains("is-visible")) {
          return;
        }
        var touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        isSwiping = false;
        menuWidth = getMenuWidth();
      }, { passive: true });

      // Touch hareketi
      menuBody.addEventListener("touchmove", function (e) {
        if (!menuBody.classList.contains("is-visible")) {
          return;
        }
        var touch = e.touches[0];
        touchCurrentX = touch.clientX;
        var deltaX = touchCurrentX - touchStartX;
        var deltaY = Math.abs(touch.clientY - touchStartY);

        // Yatay hareket dikey hareketten fazlaysa swipe
        if (Math.abs(deltaX) > 10 && Math.abs(deltaX) > deltaY) {
          isSwiping = true;
          e.preventDefault();

          // Sadece sağa çekme (pozitif deltaX)
          if (deltaX > 0) {
            menuBody.classList.add("swiping");
            var translateX = Math.min(deltaX, menuWidth);
            menuBody.style.transform = "translateX(" + translateX + "px)";
            
            // Overlay opacity ayarla
            if (overlay) {
              var opacity = 0.6 * (1 - deltaX / menuWidth);
              overlay.style.opacity = opacity;
            }
          }
        }
      }, { passive: false });

      // Touch bitişi
      menuBody.addEventListener("touchend", function (e) {
        if (!menuBody.classList.contains("is-visible")) {
          return;
        }
        
        if (isSwiping) {
          menuBody.classList.remove("swiping");
          var deltaX = touchCurrentX - touchStartX;
          
          // Eğer yeterince sağa çekildiyse menüyü kapat
          if (deltaX > swipeThreshold) {
            closeMenu();
          } else {
            // Geri animasyon
            menuBody.style.transform = "";
            if (overlay) {
              overlay.style.opacity = "";
            }
          }
          
          isSwiping = false;
        }
      }, { passive: true });

      // Touch iptal
      menuBody.addEventListener("touchcancel", function (e) {
        if (isSwiping) {
          menuBody.classList.remove("swiping");
          menuBody.style.transform = "";
          if (overlay) {
            overlay.style.opacity = "";
          }
          isSwiping = false;
        }
      }, { passive: true });

      // Menü içindeki linklere tıklanınca kapat
      menuBody.addEventListener("click", function (event) {
        var link = event.target.closest("a");
        var closeBtn = event.target.closest(".mobile-menu-close");
        if (link && !closeBtn) {
          closeMenu();
        }
      });

      // ESC tuşu ile kapat
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && menuBody && menuBody.classList.contains("is-visible")) {
          closeMenu();
        }
      });

      // Klavye navigasyonu (Enter ve Space)
      toggle.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (menuBody.classList.contains("is-visible")) {
            closeMenu();
          } else {
            openMenu();
          }
        }
      });

      // Breakpoint değişikliği
      function handleBreakpoint() {
        if (!mql.matches) {
          // Desktop'ta menüyü kapat
          if (menuBody) {
            menuBody.classList.remove("is-visible");
          }
          if (overlay) {
            overlay.classList.remove("active");
            overlay.setAttribute("aria-hidden", "true");
          }
          if (toggle) {
            toggle.classList.remove("is-active");
            toggle.setAttribute("aria-expanded", "false");
          }
          document.body.style.overflow = "";
        }
      }

      if (typeof mql.addEventListener === "function") {
        mql.addEventListener("change", handleBreakpoint);
      } else if (typeof mql.addListener === "function") {
        mql.addListener(handleBreakpoint);
      }
      handleBreakpoint();
    } catch (error) {
