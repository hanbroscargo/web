<script>
(function () {
  try {
    var scriptEl = document.currentScript;
    if (!scriptEl) {
      return;
    }
    var moduleRoot = null;
    var sibling = scriptEl.previousElementSibling;
    while (sibling) {
      if (sibling.classList && sibling.classList.contains("modulex")) {
        moduleRoot = sibling;
        break;
      }
      sibling = sibling.previousElementSibling;
    }
    if (!moduleRoot) {
      return;
    }
    var toggle = moduleRoot.querySelector(".mobile-menu-toggle");
    var menuBody = moduleRoot.querySelector(".modulexmenulistbody");
    if (!toggle || !menuBody) {
      return;
    }
    var mql = window.matchMedia("(max-width: 768px)");
    function closeMenu() {
      menuBody.classList.remove("is-visible");
      toggle.classList.remove("is-active");
      toggle.setAttribute("aria-expanded", "false");
    }
    function openMenu() {
      menuBody.classList.add("is-visible");
      toggle.classList.add("is-active");
      toggle.setAttribute("aria-expanded", "true");
    }
    toggle.addEventListener("click", function () {
      if (!mql.matches) {
        return;
      }
      if (menuBody.classList.contains("is-visible")) {
        closeMenu();
      } else {
        openMenu();
      }
    });
    menuBody.addEventListener("click", function (event) {
      if (!mql.matches) {
        return;
      }
      var link = event.target.closest("a");
      if (!link) {
        return;
      }
      closeMenu();
    });
    function handleBreakpoint() {
      if (mql.matches) {
        closeMenu();
      } else {
        menuBody.classList.remove("is-visible");
        toggle.classList.remove("is-active");
        toggle.setAttribute("aria-expanded", "false");
      }
    }
    if (typeof mql.addEventListener === "function") {
      mql.addEventListener("change", handleBreakpoint);
    } else if (typeof mql.addListener === "function") {
      mql.addListener(handleBreakpoint);
    }
    handleBreakpoint();
  } catch (error) {
    console.error("cmkhy5 mobil menü hatası:", error);
  }
})();
</script>
