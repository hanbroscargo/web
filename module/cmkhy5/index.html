<header class="modulex" role="banner">
  <div class="modulextitle" role="complementary" aria-label="Site başlığı ve dil seçimi">
    <div class="modulextitlebody">
      <h2 class="modulextitlebodytitle">{{web-name}}</h1>
      <nav class="modulextitlebodylang" aria-label="Dil seçimi">
        <ul role="list">
          {{langhtml}}
        </ul>
      </nav>
    </div>
  </div>

  <div class="modulexbody">
    <a href="/{{lang}}/" aria-label="{{web-name}} Ana Sayfa">
      <img src="/img/{{logo}}?v={{random}}" class="module-logo" alt="{{web-name}} Logo" width="300" height="auto" />
    </a>

    <div class="header-actions">
      <nav class="contact-buttons" aria-label="Hızlı erişim butonları">
        <a href="/{{lang}}/gonderi-takip/" class="btn-track" title="{{gonder}} - Gönderi takip sayfasına git">
          <i class="icon" aria-hidden="true">🚛</i>
          <span>{{gonder}}</span>
        </a>
        <a href="/{{lang}}/teklif-al/" class="btn-quote" title="{{teklifal}} - Teklif al sayfasına git">
          <i class="icon" aria-hidden="true">✏️</i>
          <span>{{teklifal}}</span>
        </a>
      </nav>
    </div>
  </div>
  <nav class="modulexmenubody" role="navigation" aria-label="Ana menü">
    <div class="modulexmenu">
      <button class="mobile-menu-toggle" aria-expanded="false" aria-label="Menüyü aç/kapat" aria-controls="modulexmenulistbody">
        <span class="mobile-menu-toggle-icon" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <div class="mobile-menu-overlay" id="mobile-menu-overlay" aria-hidden="true"></div>
      <div class="modulexmenulistbody" id="modulexmenulistbody">
        <button class="mobile-menu-close" type="button" aria-label="Menüyü kapat" aria-controls="modulexmenulistbody">
          <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
        <div class="modulexmenulist">
          {{html}}
          <div class="mobile-lang-wrapper" role="navigation" aria-label="Mobil dil seçimi">{{langhtml}}</div>
        </div>
      </div>
    </div>
  </nav>
</header>

<script>
  setTimeout(function() {
    try {
      // Direkt selector kullan - daha güvenilir
      var toggle = document.querySelector(".mobile-menu-toggle");
      var menuBody = document.querySelector(".modulexmenulistbody");
      var overlay = document.querySelector(".mobile-menu-overlay");
      var closeButton = document.querySelector(".mobile-menu-close");
      
      if (!toggle || !menuBody) {
        return;
      }
      
      var mql = window.matchMedia("(max-width: 768px)");
      
      // Menüyü aç fonksiyonu
      function openMenu() {
        if (menuBody) {
          menuBody.classList.add("is-visible");
        }
        if (overlay) {
          overlay.classList.add("active");
          overlay.setAttribute("aria-hidden", "false");
        }
        if (toggle) {
          toggle.classList.add("is-active");
          toggle.setAttribute("aria-expanded", "true");
        }
        // Body scroll'u engelle
        document.body.style.overflow = "hidden";
      }
      
      // Menüyü kapat fonksiyonu
      function closeMenu() {
        if (menuBody) {
          menuBody.classList.remove("is-visible");
        }
        if (overlay) {
          overlay.classList.remove("active");
          overlay.setAttribute("aria-hidden", "true");
        }
        if (toggle) {
          toggle.classList.remove("is-active");
          toggle.setAttribute("aria-expanded", "false");
        }
        // Body scroll'u geri getir
        document.body.style.overflow = "";
        // Focus'u menü butonuna geri ver
        if (toggle) {
          toggle.focus();
        }
      }
      
      // Toggle butonu
      toggle.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (menuBody.classList.contains("is-visible")) {
          closeMenu();
        } else {
          openMenu();
        }
      });
      
      // Kapatma butonu
      if (closeButton) {
        closeButton.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeMenu();
        });
      }
      
      // Overlay'e tıklanınca kapat
      if (overlay) {
        overlay.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          closeMenu();
        });
      }
      
      // Menü içindeki linklere tıklanınca kapat
      menuBody.addEventListener("click", function (event) {
        var link = event.target.closest("a");
        var closeBtn = event.target.closest(".mobile-menu-close");
        if (link && !closeBtn) {
          closeMenu();
        }
      });
      
      // ESC tuşu ile kapat
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && menuBody && menuBody.classList.contains("is-visible")) {
          closeMenu();
        }
      });
      
      // Klavye navigasyonu (Enter ve Space)
      toggle.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          if (menuBody.classList.contains("is-visible")) {
            closeMenu();
          } else {
            openMenu();
          }
        }
      });
      
      // Breakpoint değişikliği
      function handleBreakpoint() {
        if (!mql.matches) {
          // Desktop'ta menüyü kapat
          if (menuBody) {
            menuBody.classList.remove("is-visible");
          }
          if (overlay) {
            overlay.classList.remove("active");
            overlay.setAttribute("aria-hidden", "true");
          }
          if (toggle) {
            toggle.classList.remove("is-active");
            toggle.setAttribute("aria-expanded", "false");
          }
          document.body.style.overflow = "";
        }
      }
      
      if (typeof mql.addEventListener === "function") {
        mql.addEventListener("change", handleBreakpoint);
      } else if (typeof mql.addListener === "function") {
        mql.addListener(handleBreakpoint);
      }
      handleBreakpoint();
    } catch (error) {
      console.error("cmkhy5 mobil menü hatası:", error);
    }
  }, 100);
</script>
